name: ${AI_GDM_PROJECT_NAME:-ai-gdm}

services:
  postgres:
    image: postgis/postgis:17-3.5@sha256:83e9999dc3ad8390c210e76130c3a16365ef4f957bb55200d22b7937cfbcb321
    pull_policy: never
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ai_gdm
      - POSTGRES_USER=ai_gdm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    image: redis:7.4.10-bookworm@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73
    pull_policy: never
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --save 60 1000 --requirepass "${REDIS_PASSWORD}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  app:
    image: ${AI_GDM_IMAGE:-ai-gdm/server:local}
    pull_policy: never
    restart: unless-stopped
    init: true
    env_file:
      - ${AI_GDM_RUNTIME_ENV_FILE:-./deploy/runtime.env}
    environment:
      APP_HTTP_ADDR: :8080
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
      LHASA_DATA_DIR: /var/lib/ai-gdm/lhasa
      GDAL_BINARY: /usr/bin/gdal
      GDAL_TEMP_DIR: /tmp/ai-gdm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - ${AI_GDM_BIND_ADDRESS:-0.0.0.0}:${AI_GDM_HTTP_PORT:-8080}:8080
    volumes:
      - lhasa-data:/var/lib/ai-gdm/lhasa
    tmpfs:
      - /tmp/ai-gdm:rw,noexec,nosuid,nodev,size=1g,uid=10001,gid=10001,mode=0700
    networks:
      - backend
      - egress
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres-data:
  redis-data:
  lhasa-data:

networks:
  backend:
    internal: true
  egress:
